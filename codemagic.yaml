workflows:
  thorfin-android:
    name: THORFIN Android APK

    max_build_duration: 60

    instance_type: mac_mini_m2

    environment:
      flutter: stable

      # IMPORTANT:
      # Gemini API key Codemagic UI ke THORFIN
      # variable group se aayegi.
      groups:
        - THORFIN

    scripts:

      # ---------------------------------------------------------
      # CREATE ANDROID PROJECT
      # ---------------------------------------------------------

      - name: Create Android project
        script: |
          flutter create --platforms=android .

      # ---------------------------------------------------------
      # ANDROID PERMISSIONS
      # ---------------------------------------------------------

      - name: Configure Android permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permissions = """    <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
          """

          if "android.permission.RECORD_AUDIO" not in text:
              text = text.replace(
                  "    <application",
                  permissions + "\n    <application",
                  1
              )

          queries = """    <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService"/>
                  </intent>
              </queries>
          """

          if "android.speech.RecognitionService" not in text:
              text = text.replace(
                  "    <application",
                  queries + "\n    <application",
                  1
              )

          manifest.write_text(text)

          print("Android permissions configured.")
          PY

      # ---------------------------------------------------------
      # FLUTTER PACKAGES
      # ---------------------------------------------------------

      - name: Get Flutter packages
        script: |
          flutter pub get

      # ---------------------------------------------------------
      # CHECK GEMINI KEY
      # ---------------------------------------------------------

      - name: Check Gemini configuration
        script: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY is empty."
            echo "Make sure the THORFIN variable group is imported."
            exit 1
          fi

          echo "Gemini API key detected."

      # ---------------------------------------------------------
      # BUILD APK
      # ---------------------------------------------------------

      - name: Build THORFIN APK
        script: |
          flutter build apk --debug \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

    # -----------------------------------------------------------
    # APK OUTPUT
    # -----------------------------------------------------------

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
